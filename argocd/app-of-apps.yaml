apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: lifecycle-quest-root
  namespace: openshift-gitops
spec:
  project: lifecycle-quest
  source:
    repoURL: https://github.com/h8x0rd/openshift-lifecycle-quest-claude
    targetRevision: main
    path: argocd/applications
  destination:
    server: https://kubernetes.default.svc
    namespace: openshift-gitops
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
